# main dalına her push'ta siteyi cPanel'e FTP ile yükler.
# GitHub > Settings > Secrets and variables > Actions altında şu secret'lar gerekli:
#   FTP_SERVER    örn: ftp.okutan.org
#   FTP_USERNAME  cPanel FTP kullanıcı adı
#   FTP_PASSWORD  cPanel FTP şifresi
#   FTP_DIR       örn: ./public_html/   (FTP hesabı doğrudan public_html'e açılıyorsa: ./ )
# Not: Sunucudaki /kelimeler klasörüne ve repoda olmayan dosyalara dokunulmaz.
name: Deploy okutan.org

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            github-profile/**
            README.md
            .htaccess
            kelimeler/**
