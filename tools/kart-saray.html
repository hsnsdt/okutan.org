<!doctype html>
<!-- Vale, kız ve papaz kartlarını tek resimde birleştirir: assets/kart-saray.webp
     Kaynak: Wikimedia Commons, Dmitry Fomin, English pattern playing cards (CC0 1.0), tools/kart-resim/*.svg
     Kartlar olduğu gibi kullanılır (köşe harfleri, çerçeve, figür); yalnızca dış kenar çizgisi kırpılır.
     Üretim (proje kökünde, yerel sunucu açıkken):
       chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1000,1077          --screenshot=saray.png http://127.0.0.1:8765/tools/kart-saray.html
       php -d extension=gd -r '$s=imagecreatefrompng("saray.png");$d=imagecreatetruecolor(800,864);imagecopyresampled($d,$s,0,0,0,0,800,864,1000,1077);imagewebp($d,"assets/kart-saray.webp",82);'
     Düzen: sütunlar maça, kupa, karo, sinek (S H D C); satırlar vale, kız, papaz (J Q K). Hücre 250×359 çizilir, 200×288'e küçültülür.
     SVG'ler Wikimedia'dan elle indirilir (betikle istek 429 hız sınırına takılıyor). -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1077px;overflow:hidden;background:#fff}
.g{display:grid;grid-template-columns:repeat(4,250px);grid-template-rows:repeat(3,359px)}
.c{position:relative;overflow:hidden;width:250px;height:359px;background:#fff}
/* kartı genişliğe göre ölçekle, dış kenar çizgisini kırp */
.c img{position:absolute;left:-2px;top:-11px;width:254px;height:381px}
</style></head><body><div class="g" id="g"></div>
<script>
var html = '';
['jack', 'queen', 'king'].forEach(function (r) {
  ['spades', 'hearts', 'diamonds', 'clubs'].forEach(function (s) {
    html += '<div class="c"><img src="kart-resim/English_pattern_' + r + '_of_' + s + '.svg" alt=""></div>';
  });
});
document.getElementById('g').innerHTML = html;
</script></body></html>
