<!doctype html>
<!-- 52 kartı tek resimde birleştirir: assets/kart-deste.webp
     Kaynak: Vector Playing Cards (Byron Knoll, kamu malı), tools/kart-deste/*.svg — kartlar olduğu gibi kullanılır.
     Üretim (proje kökünde, yerel sunucu açıkken):
       chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=3250,1440 --screenshot=deste.png http://127.0.0.1:8766/tools/kart-deste.html
       php -d extension=gd -r '$s=imagecreatefrompng("deste.png");$d=imagecreatetruecolor(2600,1152);imagecopyresampled($d,$s,0,0,0,0,2600,1152,3250,1440);imagewebp($d,"assets/kart-deste.webp",80);'
     Düzen: sütunlar 2..10, vale, kız, papaz, as; satırlar maça, kupa, karo, sinek (S H D C). Hücre 250×360 çizilir, 200×288'e küçültülür. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:3250px;height:1440px;overflow:hidden;background:#fff}
.g{display:grid;grid-template-columns:repeat(13,250px);grid-template-rows:repeat(4,360px)}
.c{position:relative;overflow:hidden;width:250px;height:360px;background:#fff}
/* kart hücreye tam oturur: SVG'nin kendi çerçevesi kartın kenarı olur (oyunda .card.im köşe yarıçapı buna eşit, %4,5) */
.c img{position:absolute;left:0;top:0;width:250px;height:360px}
</style></head><body><div class="g" id="g"></div>
<script>
var html = '', R = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'jack', 'queen', 'king', 'ace'];
['spades', 'hearts', 'diamonds', 'clubs'].forEach(function (s) {
  R.forEach(function (r) { html += '<div class="c"><img src="kart-deste/' + r + '_of_' + s + '.svg" alt=""></div>'; });
});
document.getElementById('g').innerHTML = html;
</script></body></html>
